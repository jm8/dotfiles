[[language]]
name = "nix"
formatter = { command = "alejandra", args = ["--quiet", "-"] }
auto-format = true

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]

[[language]]
name = "python"
language-servers = ["ruff", "ty"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true
